name: Universal Multi-Platform Build (Windows .EXE & Android .APK)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App (.EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Package Windows Executable (Electron Builder)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypoLab-Windows-Desktop
          path: dist-electron/*.exe
          if-no-files-found: error

  build-android:
    name: Build Android Mobile App (.APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Add and Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/TypoLab-Android.apk

      - name: Upload Android .APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypoLab-Android-App
          path: output-apk/TypoLab-Android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release with Downloads
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: TypoLab-Windows-Desktop
          path: release-files

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: TypoLab-Android-App
          path: release-files

      - name: Create GitHub Release with Attached Binaries
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: release-files/*
          name: TypoLab Studio Release ${{ github.ref_name }}
          body: |
            ## 🎉 TypoLab Studio Official Release Downloads
            
            ### 🖥️ Windows Desktop App:
            - **`TypoLab-Setup-3.0.0.exe`** (Windows 64-bit Installer)
            - **`TypoLab 3.0.0.exe`** (Portable, No installation required)

            ### 📱 Android Mobile App:
            - **`TypoLab-Android.apk`** (Android Standalone APK)

            ### 🌐 Live Progressive Web App:
            - Visit online: [https://typolab-ecru.vercel.app/](https://typolab-ecru.vercel.app/)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
